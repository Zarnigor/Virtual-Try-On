services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tryon}
      POSTGRES_USER: ${POSTGRES_USER:-tryon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tryon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tryon}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
