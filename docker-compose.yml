services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tryon
      POSTGRES_USER: tryon
      POSTGRES_PASSWORD: tryon_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - media:/app/media
      - u2net:/root/.u2net   # rembg model cache (176 MB), survives container rebuilds
      - ./prompts:/prompts:ro  # AI prompt texts (settings.PROMPTS_DIR)
      - ./avatars:/avatars:ro  # real avatar photos for seed_avatars --from /avatars (not in git)
      - ./demo_garments:/demo_garments  # build_demo / export_demo_garments folder (not in git)
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://tryon:tryon_dev@db:5432/tryon
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=1
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - MEDIA_URL=/media/
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_VALIDATION_MODEL=${GEMINI_VALIDATION_MODEL:-}
      - AI_DEV_BYPASS=${AI_DEV_BYPASS:-0}  # local dev only, see settings/base.py
      - AI_CLEANING_ENABLED=${AI_CLEANING_ENABLED:-0}  # prompt 04, off: no image credits (docs/09 #55)
      - BODY_AI_CHECK_ENABLED=${BODY_AI_CHECK_ENABLED:-1}  # prompt 02 on own-body uploads; 0 honoured only with DEBUG
      - DEMO_MODE=${DEMO_MODE:-0}  # precomputed try-on results (manage.py build_demo)
      - TRYON_SHADING=${TRYON_SHADING:-0}  # try-on realism effects, off by default
      - TRYON_CONTACT_SHADOW=${TRYON_CONTACT_SHADOW:-0}
      - TRYON_EDGE_FEATHER=${TRYON_EDGE_FEATHER:-0}
      - TRYON_SHOULDER_CAP=${TRYON_SHOULDER_CAP:-1}  # structural try-on steps, on by default
      - TRYON_HEM_SNAP=${TRYON_HEM_SNAP:-1}
      - TRYON_HALO_REMOVAL=${TRYON_HALO_REMOVAL:-1}
      - TRYON_NECK_FIX=${TRYON_NECK_FIX:-1}
      - TRYON_NECK_GAP_FILL=${TRYON_NECK_GAP_FILL:-1}
      - TRYON_DROPPED_SHOULDER_SINGLE=${TRYON_DROPPED_SHOULDER_SINGLE:-0}
      - TRYON_HEM_RULE=${TRYON_HEM_RULE:-1}
      - TRYON_WARP=${TRYON_WARP:-mls}  # T-shirt warp engine: mls (default, docs/09 #105) | parts
      - TRYON_NECK_HOLE=${TRYON_NECK_HOLE:-1}  # owner-drawn neckline hole, MLS only (docs/09 #102)
      - TRYON_MLS_SLEEVE=${TRYON_MLS_SLEEVE:-C}  # MLS sleeve variant r7|A|B|C (docs/09 #104)
      - TRYON_MLS_TUBE=${TRYON_MLS_TUBE:-1}  # adapt T-shirts on MLS (docs/09 #105): tube sleeves, 0 = MLS sleeves
      - TRYON_MLS_SIDE_FLOOR=${TRYON_MLS_SIDE_FLOOR:-mask}  # mask | off
      - TRYON_MLS_ARMPIT=${TRYON_MLS_ARMPIT:-r14}  # r14 | off (needs the tube and the side floor)
      - TRYON_MLS_HEM=${TRYON_MLS_HEM:-garment}  # garment | mls (no hem post-processing)
      - TRYON_MLS_CUFF=${TRYON_MLS_CUFF:-hem}  # tube sleeves (docs/09 #106): hem | chord
      - TRYON_MLS_FRINGE=${TRYON_MLS_FRINGE:-drop}  # tube sleeves (docs/09 #106): drop | keep
      - TRYON_FINISH=${TRYON_FINISH:-r17}  # T-shirt finish (docs/09 #107): r17 | off
      - TRYON_FINISH_PANTS=${TRYON_FINISH_PANTS:-1}  # the finish on pants too (docs/09 #108): 1 | 0
      - TRYON_PANTS_TUCK=${TRYON_PANTS_TUCK:-1}  # T-shirt hangs over the pants (docs/09 #109): 1 | 0
      - GARMENT_FLATTEN_LIGHTING=${GARMENT_FLATTEN_LIGHTING:-1}  # flatten lighting of near-solid garments
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-5}
      - AI_GARMENT_DAILY_LIMIT=${AI_GARMENT_DAILY_LIMIT:-5}
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    entrypoint: []
    command: celery -A tryon_studio worker -l info
    volumes:
      - ./backend:/app
      - media:/app/media
      - u2net:/root/.u2net   # rembg model cache (176 MB), survives container rebuilds
      - ./prompts:/prompts:ro  # AI prompt texts (settings.PROMPTS_DIR)
    environment:
      - DATABASE_URL=postgres://tryon:tryon_dev@db:5432/tryon
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_VALIDATION_MODEL=${GEMINI_VALIDATION_MODEL:-}
      - AI_DEV_BYPASS=${AI_DEV_BYPASS:-0}  # local dev only, see settings/base.py
      - AI_CLEANING_ENABLED=${AI_CLEANING_ENABLED:-0}  # prompt 04, off: no image credits (docs/09 #55)
      - BODY_AI_CHECK_ENABLED=${BODY_AI_CHECK_ENABLED:-1}  # prompt 02 on own-body uploads; 0 honoured only with DEBUG
      - DEMO_MODE=${DEMO_MODE:-0}  # precomputed try-on results (manage.py build_demo)
      - TRYON_SHADING=${TRYON_SHADING:-0}  # try-on realism effects, off by default
      - TRYON_CONTACT_SHADOW=${TRYON_CONTACT_SHADOW:-0}
      - TRYON_EDGE_FEATHER=${TRYON_EDGE_FEATHER:-0}
      - TRYON_SHOULDER_CAP=${TRYON_SHOULDER_CAP:-1}  # structural try-on steps, on by default
      - TRYON_HEM_SNAP=${TRYON_HEM_SNAP:-1}
      - TRYON_HALO_REMOVAL=${TRYON_HALO_REMOVAL:-1}
      - TRYON_NECK_FIX=${TRYON_NECK_FIX:-1}
      - TRYON_NECK_GAP_FILL=${TRYON_NECK_GAP_FILL:-1}
      - TRYON_DROPPED_SHOULDER_SINGLE=${TRYON_DROPPED_SHOULDER_SINGLE:-0}
      - TRYON_HEM_RULE=${TRYON_HEM_RULE:-1}
      - TRYON_WARP=${TRYON_WARP:-mls}  # T-shirt warp engine: mls (default, docs/09 #105) | parts
      - TRYON_NECK_HOLE=${TRYON_NECK_HOLE:-1}  # owner-drawn neckline hole, MLS only (docs/09 #102)
      - TRYON_MLS_SLEEVE=${TRYON_MLS_SLEEVE:-C}  # MLS sleeve variant r7|A|B|C (docs/09 #104)
      - TRYON_MLS_TUBE=${TRYON_MLS_TUBE:-1}  # adapt T-shirts on MLS (docs/09 #105): tube sleeves, 0 = MLS sleeves
      - TRYON_MLS_SIDE_FLOOR=${TRYON_MLS_SIDE_FLOOR:-mask}  # mask | off
      - TRYON_MLS_ARMPIT=${TRYON_MLS_ARMPIT:-r14}  # r14 | off (needs the tube and the side floor)
      - TRYON_MLS_HEM=${TRYON_MLS_HEM:-garment}  # garment | mls (no hem post-processing)
      - TRYON_MLS_CUFF=${TRYON_MLS_CUFF:-hem}  # tube sleeves (docs/09 #106): hem | chord
      - TRYON_MLS_FRINGE=${TRYON_MLS_FRINGE:-drop}  # tube sleeves (docs/09 #106): drop | keep
      - TRYON_FINISH=${TRYON_FINISH:-r17}  # T-shirt finish (docs/09 #107): r17 | off
      - TRYON_FINISH_PANTS=${TRYON_FINISH_PANTS:-1}  # the finish on pants too (docs/09 #108): 1 | 0
      - TRYON_PANTS_TUCK=${TRYON_PANTS_TUCK:-1}  # T-shirt hangs over the pants (docs/09 #109): 1 | 0
      - GARMENT_FLATTEN_LIGHTING=${GARMENT_FLATTEN_LIGHTING:-1}  # flatten lighting of near-solid garments
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-5}
      - AI_GARMENT_DAILY_LIMIT=${AI_GARMENT_DAILY_LIMIT:-5}
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pgdata:
  media:
  u2net:
